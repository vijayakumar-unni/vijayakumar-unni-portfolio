name: Sync portfolio from resume

on:
  push:
    paths:
      - resume/**/*.pdf
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF parser
        run: python -m pip install pypdf

      - name: Generate resume metadata
        run: python scripts/sync_resume.py

      - name: Commit generated metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resume-data.json
          git diff --cached --quiet || git commit -m "Sync portfolio metadata from resume"
          git push